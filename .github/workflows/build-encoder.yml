name: Build Encoder

on:
  push:
    paths:
      - 'Encoder/**'
      - 'Unity/**'
      - 'Tests/**'
      - '.github/workflows/build-encoder.yml'
  pull_request:
    paths:
      - 'Encoder/**'
      - 'Unity/**'
      - 'Tests/**'
      - '.github/workflows/build-encoder.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate Unity package manifest
        shell: pwsh
        run: |
          $pkg = Get-Content Unity/package.json -Raw | ConvertFrom-Json
          if ($pkg.name -ne 'com.quanquanhhh.qanimator') { throw 'Unexpected Unity package name.' }
          if (-not $pkg.unity.StartsWith('6000.')) { throw 'QAnimator Unity package must target Unity 6000.' }

      - name: Guard runtime from video/system decoder dependencies
        shell: pwsh
        run: |
          $patterns = @('UnityEngine\.Video', '\bVideoPlayer\b', '\bFFmpeg\b', '\bffmpeg\b', 'System\.Diagnostics\.Process')
          $hits = Get-ChildItem Unity/Runtime -Filter *.cs -Recurse | Select-String -Pattern $patterns
          if ($hits) {
            $hits | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line)" }
            throw 'Unity Runtime must remain a custom decoder and may not depend on VideoPlayer/FFmpeg/system processes.'
          }

      - name: Build encoder
        run: dotnet build Encoder/QAnimator.Encoder.csproj -c Release

      - name: Run codec round-trip tests
        run: dotnet run --project Tests/QAnimator.CodecSmoke/QAnimator.CodecSmoke.csproj -c Release

      - name: Ensure FFmpeg is available
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version
          ffprobe -version

      - name: Generate synthetic MP4
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=48x34:rate=10" -t 0.8 -pix_fmt yuv420p artifacts/qanim-e2e.mp4

      - name: Convert MP4 through real encoder CLI
        run: dotnet run --project Encoder/QAnimator.Encoder.csproj -c Release -- --input artifacts/qanim-e2e.mp4 --output artifacts/qanim-e2e.bytes --fps 10 --key-interval 3 --block-size 8

      - name: Decode and validate generated MP4 bytes
        run: dotnet run --project Tests/QAnimator.CodecSmoke/QAnimator.CodecSmoke.csproj -c Release -- artifacts/qanim-e2e.bytes

      - name: Generate transparent VP9 WebM
        shell: pwsh
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=black@0.0:s=48x34:r=10:d=0.8,format=rgba" -vf "drawbox=x=8:y=6:w=20:h=18:color=red@0.75:t=fill,format=yuva420p" -c:v libvpx-vp9 -lossless 1 -pix_fmt yuva420p artifacts/qanim-alpha.webm
          ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt:stream_tags=alpha_mode -of default=noprint_wrappers=1 artifacts/qanim-alpha.webm

      - name: Convert transparent WebM
        run: dotnet run --project Encoder/QAnimator.Encoder.csproj -c Release -- --input artifacts/qanim-alpha.webm --output artifacts/qanim-alpha.bytes --fps 10 --key-interval 3 --block-size 8

      - name: Validate alpha metadata and pixels
        shell: pwsh
        run: |
          dotnet run --project Tests/QAnimator.CodecSmoke/QAnimator.CodecSmoke.csproj -c Release -- --require-alpha artifacts/qanim-alpha.bytes
          ffmpeg -hide_banner -loglevel error -y -c:v libvpx-vp9 -i artifacts/qanim-alpha.webm -vf "scale=48:34:flags=lanczos,fps=10,vflip" -frames:v 1 -f rawvideo -pix_fmt rgba artifacts/qanim-alpha-expected.rgba
          dotnet run --project Tests/QAnimator.CodecSmoke/QAnimator.CodecSmoke.csproj -c Release -- --dump-frame artifacts/qanim-alpha.bytes 0 artifacts/qanim-alpha-decoded.rgba
          $expected = (Get-FileHash artifacts/qanim-alpha-expected.rgba -Algorithm SHA256).Hash
          $decoded = (Get-FileHash artifacts/qanim-alpha-decoded.rgba -Algorithm SHA256).Hash
          if ($expected -ne $decoded) { throw "Alpha frame pixels differ after QAnimator conversion." }

      - name: Publish portable Windows x64 encoder
        run: dotnet publish Encoder/QAnimator.Encoder.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/QAnimatorEncoder

      - name: Upload encoder artifact
        uses: actions/upload-artifact@v4
        with:
          name: QAnimatorEncoder-win-x64
          path: artifacts/QAnimatorEncoder/**
