name: Build Encoder

on:
  push:
    paths:
      - 'Encoder/**'
      - '.github/workflows/build-encoder.yml'
  pull_request:
    paths:
      - 'Encoder/**'
      - '.github/workflows/build-encoder.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build encoder
        run: dotnet build Encoder/QAnimator.Encoder.csproj -c Release

      - name: Publish Windows x64
        run: dotnet publish Encoder/QAnimator.Encoder.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o artifacts/QAnimatorEncoder

      - name: Upload encoder artifact
        uses: actions/upload-artifact@v4
        with:
          name: QAnimatorEncoder-win-x64
          path: artifacts/QAnimatorEncoder/**
